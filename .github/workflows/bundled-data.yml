name: "ci-bundled-data"
on:
  workflow_dispatch:
  schedule:
    - cron: '00 07 * * *'
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  bundled-data:
    name: bundled-data
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout_repository
        uses: actions/checkout@v7

      - name: install_rust
        uses: dtolnay/rust-toolchain@stable

      - name: regenerate_bundled_data
        run: cargo run --release -p rust-releases-bundled-generator

      - name: detect_changes
        id: detect_changes
        run: |
          if git diff --quiet -- crates/rust-releases-bundled/src/generated; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: bump_patch_version
        id: bump_patch_version
        if: steps.detect_changes.outputs.changed == 'true'
        run: |
          version="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "rust-releases-bundled") | .version')"
          next="$(echo "$version" | awk -F. '{ print $1 "." $2 "." $3 + 1 }')"
          sed -i "s|^version = \"${version}\"$|version = \"${next}\"|" crates/rust-releases-bundled/Cargo.toml
          echo "version=${next}" >> "$GITHUB_OUTPUT"

      - name: update_changelog
        if: steps.detect_changes.outputs.changed == 'true'
        run: |
          sed -i "s|^## Unreleased$|&\n\n### Changed\n\n- Updated the bundled release data|" crates/rust-releases-bundled/CHANGELOG.md
          ./.github/scripts/release-changelog.py rust-releases-bundled

      - name: test_bundled_data
        if: steps.detect_changes.outputs.changed == 'true'
        run: cargo test -p rust-releases-bundled --all-features

      - name: commit_bundled_data
        if: steps.detect_changes.outputs.changed == 'true'
        run: |
          git config user.name "foresterre[bot]"
          git config user.email "5955761+foresterre@users.noreply.github.com"
          git add crates/rust-releases-bundled
          git commit -m "Release rust-releases-bundled v${{ steps.bump_patch_version.outputs.version }} with updated release data"
          git push

      - name: publish_bundled_data
        if: steps.detect_changes.outputs.changed == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p rust-releases-bundled
