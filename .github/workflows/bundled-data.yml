name: "ci-bundled-data"
on:
  workflow_dispatch:
  schedule:
    - cron: '00 07 * * *'
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  bundled-data:
    name: bundled-data
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout_repository
        uses: actions/checkout@v7

      - name: install_rust
        uses: dtolnay/rust-toolchain@stable

      - name: regenerate_bundled_data
        run: cargo run --release -p rust-releases-bundled-generator

      - name: detect_changes
        id: detect_changes
        run: |
          if git diff --quiet -- crates/rust-releases-bundled/src/generated; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: bump_patch_version
        id: bump_patch_version
        if: steps.detect_changes.outputs.changed == 'true'
        run: |
          version="$(./.github/scripts/bump-version.py patch rust-releases-bundled)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: update_changelog
        if: steps.detect_changes.outputs.changed == 'true'
        run: |
          ./.github/scripts/add-changelog-entry.py crates/rust-releases-bundled/CHANGELOG.md Changed "Updated the bundled release data"
          ./.github/scripts/release-changelog.py rust-releases-bundled

      - name: test_bundled_data
        if: steps.detect_changes.outputs.changed == 'true'
        run: cargo test -p rust-releases-bundled --all-features

      - name: commit_bundled_data
        if: steps.detect_changes.outputs.changed == 'true'
        run: |
          git config user.name "foresterre[bot]"
          git config user.email "5955761+foresterre@users.noreply.github.com"
          git add Cargo.toml crates/rust-releases-bundled
          git commit -m "Release rust-releases-bundled v${{ steps.bump_patch_version.outputs.version }}"
          git push

      - name: publish_bundled_data
        if: steps.detect_changes.outputs.changed == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p rust-releases-bundled

      - name: tag_bundled_data
        if: steps.detect_changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/rust-releases-bundled-v${{ steps.bump_patch_version.outputs.version }}" \
            -f sha="$(git rev-parse HEAD)"
