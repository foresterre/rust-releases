name: "publish-release"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.published.outputs.publish }}
    steps:
      - name: checkout_repository
        uses: actions/checkout@v7

      - name: determine_version
        id: version
        run: |
          version="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "rust-releases") | .version')"
          test -n "$version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: determine_published
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  changelog:
    name: changelog
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: checkout_repository
        uses: actions/checkout@v7

      - name: update_changelog
        run: ./.github/scripts/release-changelog.py

      - name: commit_changelogs
        id: commit
        run: |
          if ! git diff --quiet -- '*CHANGELOG.md'; then
            git config user.name "foresterre[bot]"
            git config user.email "5955761+foresterre@users.noreply.github.com"
            git add '*CHANGELOG.md'
            git commit -m "Release v${{ needs.version.outputs.version }}"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    name: publish
    needs:
      - version
      - changelog
    runs-on: ubuntu-latest
    steps:
      - name: checkout_repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changelog.outputs.sha }}

      - name: install_rust
        uses: dtolnay/rust-toolchain@stable

      - name: publish_workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace

  release:
    name: release
    needs:
      - version
      - changelog
      - publish
    runs-on: ubuntu-latest
    steps:
      - name: checkout_repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changelog.outputs.sha }}

      - name: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.version.outputs.version }}" \
            --target "${{ needs.changelog.outputs.sha }}" \
            --title "v${{ needs.version.outputs.version }}" \
            --generate-notes
