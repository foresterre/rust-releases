[package]
name = "rust-releases"
description = "Find, index and obtain all officially available Rust releases"
version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
exclude = [
    "/resources", # used by test cases; not relevant for library consumers; approx. 1MB
    "/.github", # version control and CI configs
    "/bors.toml", # CI staging bot config
    "/deny.toml" # dependency license checking config
]
rust-version = "1.94.1"


[workspace]
members = [
    # extra
    "crates/rust-release",
    "crates/rust-toolchain",
    # core & shared impl
    "crates/rust-releases-core",
    "crates/rust-releases-io",
    # sources
    "crates/rust-releases-bundled",
    "crates/rust-releases-github",
    "crates/rust-releases-rust-changelog",
    "crates/rust-releases-rust-dist",
    # tooling
    "crates/rust-releases-bundled-generator",
]

[features]
default = [
    "rust-changelog",
]

bundled = ["rust-releases-bundled"]
github = ["rust-releases-github"]
rust-changelog = ["rust-releases-rust-changelog"]
rust-dist = ["rust-releases-rust-dist"]

# Release channels bundled by the rust-releases-bundled source
bundled-beta = ["bundled", "rust-releases-bundled?/beta"]
bundled-nightly = ["bundled", "rust-releases-bundled?/nightly"]

# Transports for the rust-releases-io clients
reqwest = [
    "rust-releases-io/reqwest",
    "rust-releases-github?/reqwest",
    "rust-releases-rust-changelog?/reqwest",
]
ureq = [
    "rust-releases-io/ureq",
    "rust-releases-github?/ureq",
    "rust-releases-rust-changelog?/ureq",
]

[dependencies]
# types and shared impl's
rust-releases-core = { workspace = true }
rust-releases-io = { workspace = true, optional = true }

# sources
rust-releases-bundled = { workspace = true, optional = true }
rust-releases-github = { workspace = true, optional = true }
rust-releases-rust-changelog = { workspace = true, optional = true }
rust-releases-rust-dist = { workspace = true, optional = true }

[dev-dependencies]
yare = { workspace = true }

[[example]]
name = "list-stable"
required-features = ["bundled", "github", "rust-changelog", "rust-dist", "ureq"]

[[example]]
name = "list-beta"
required-features = ["bundled-beta", "rust-dist"]

[[example]]
name = "list-nightly"
required-features = ["bundled-nightly", "rust-dist"]

[workspace.package]
version = "0.33.0"
authors = ["Martijn Gribnau <garm@ilumeo.com>"]
license = "MIT OR Apache-2.0"
edition = "2024"
repository = "https://github.com/foresterre/rust-releases"

[workspace.dependencies]
# Declarative error handling
thiserror = "2.0.12"

# Parameterized tests
yare = "3.0.0"

rust-release = { version = "2.0.0", path = "crates/rust-release" }
rust-toolchain = { version = "2.0.0", path = "crates/rust-toolchain" }
rust-releases-core = { version = "^0.33.0", path = "crates/rust-releases-core" }
rust-releases-io = { version = "^0.33.0", path = "crates/rust-releases-io" }

rust-releases-bundled = { version = "^0.1.0", path = "crates/rust-releases-bundled", features = ["stable", "beta", "nightly"] }
rust-releases-github = { version = "^0.33.0", path = "crates/rust-releases-github" }
rust-releases-rust-changelog = { version = "^0.33.0", path = "crates/rust-releases-rust-changelog" }
rust-releases-rust-dist = { version = "^0.33.0", path = "crates/rust-releases-rust-dist" }
