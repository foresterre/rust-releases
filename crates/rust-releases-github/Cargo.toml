[package]
name = "rust-releases-github"
description = "GithubReleases source implementation for rust-releasess"
version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
rust-version = "1.94.1"

[features]
default = ["ureq"]
# A blocking client, backed by ureq
ureq = ["rust-releases-io/ureq"]
# An asynchronous client, backed by reqwest
reqwest = ["rust-releases-io/reqwest"]

[dependencies]
rust-releases-core = { workspace = true }
rust-releases-io = { workspace = true }
thiserror = { workspace = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
http = "1.5.0"
tokio = { version = "1.48.0", features = ["macros", "rt"] }
yare = { workspace = true }

[[example]]
name = "github-list-stable-releases"
required-features = ["ureq"]

[[example]]
name = "github-list-stable-releases-async"
required-features = ["reqwest"]
